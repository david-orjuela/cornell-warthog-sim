tree_point_cloud_reconstructor:
  ros__parameters:
    use_sim_time: false

    # Jetson / RealSense aligned RGB-D streams.
    color_topic: /sensors/camera_jetson/color/image_raw
    depth_topic: /sensors/camera_jetson/aligned_depth_to_color/image_raw
    camera_info_topic: /sensors/camera_jetson/aligned_depth_to_color/camera_info
    joint_state_topic: /joint_states

    # Capture transaction:
    #   request UInt32 N -> result Int32 +N accepted / -N rejected.
    capture_request_topic: /tree_scan/capture_request
    capture_result_topic: /tree_scan/capture_result
    scan_finished_topic: /tree_scan/scan_finished
    output_cloud_topic: /tree_scan/global_cloud
    original_cloud_topic: /tree_scan/latest_tf_cloud

    # Moving-arm reconstruction must use the robot fixed frame and exact sensor time.
    target_frame: base_link
    camera_frame_override: ""

    output_root: ~/dev/tree_scans
    # MUST be unique for every preflight, partial test, and complete scan.
    scan_id: outdoor_tree_6 
    capture_on_start: false

    sync_queue_size: 30
    sync_slop_sec: 0.08
    tf_timeout_sec: 0.75

    # Reject synchronizer frames buffered before the pose-specific request.
    post_request_guard_sec: 0.0
    # Warning only; measured age also contains transport latency.
    sensor_clock_warning_sec: 0.25

    # Five new frames are collected after motion success + settle.
    # Per-pixel median ignores zero depth; at least two nonzero observations
    # are required to keep a pixel.
    depth_burst_size: 5
    depth_burst_min_valid_samples: 2
    # A trajectory capture request remains at the same robot pose while the
    # reconstructor tries up to three independent fresh bursts. Rejected
    # attempts are saved but never merged. Only the final exhausted rejection
    # is published back to the trajectory node.
    capture_max_attempts: 3
    capture_retry_delay_sec: 0.25
    # Reject a burst if the exact-time camera TF shows meaningful motion.
    burst_pose_translation_tolerance_m: 0.005
    burst_pose_rotation_tolerance_deg: 0.5

    # D435-family conservative validity limits. The 3.5 m value matches the
    # final outdoor_tree_6 run; outdoor_tree_1 through _5 used 2.5 m.
    
    min_depth_m: 0.30
    max_depth_m: 3.50
    # 0 = auto: 1000 raw units/m for 16UC1, 1 for 32FC1.
    depth_scale_override: 0.0

    # Optional target-relative crop. Leave disabled until target distance and
    # broad box dimensions have been measured. In camera_forward mode, the
    # first accepted burst locks one center in base_link at +Z optical distance.
    target_crop_enabled: false
    target_center_mode: camera_forward  # camera_forward | fixed_target_frame
    target_distance_m: 1.0
    target_center_target_frame_m: [0.0, 0.0, 0.0]
    # Axis-aligned X/Y/Z dimensions in target_frame, not camera-frame pixels.
    target_box_size_m: [1.0, 1.0, 1.5]

    local_voxel_size_m: 0.003
    global_voxel_size_m: 0.003
    outlier_removal_enabled: true
    outlier_filter_mode: statistical  # none | radius | statistical
    outlier_radius_m: 0.020
    outlier_min_neighbors: 6
    statistical_nb_neighbors: 20
    statistical_std_ratio: 2.0

    use_icp: true
    icp_crop_margin_m: 0.15
    icp_min_target_points: 200
    # Retain the established limits until the camera extrinsic is validated.
    # Then evaluate approximately 0.03 m / 5 degrees against saved data.
    max_icp_correction_translation_m: 0.10
    max_icp_correction_rotation_deg: 12.0

    # Preserve each burst, zero-aware median, intrinsics, exact TF,
    # joint-state snapshot, and unfiltered PLY.
    save_raw_point_clouds: true
    publish_original_cloud: true
    shutdown_on_scan_finished: false

    registration:
      SN3:
        voxel_size_m: 0.05
        max_correspondence_distance_m: 0.05
        max_iterations: 50
        relative_rmse: 1.0e-6
        relative_fitness: 1.0e-6
        rmse_threshold_m: 0.025
        fitness_threshold: 0.35
      SN2:
        voxel_size_m: 0.02
        max_correspondence_distance_m: 0.03
        max_iterations: 30
        relative_rmse: 1.0e-6
        relative_fitness: 1.0e-6
        rmse_threshold_m: 0.015
        fitness_threshold: 0.40
      SN1:
        voxel_size_m: 0.01
        max_correspondence_distance_m: 0.018
        max_iterations: 20
        relative_rmse: 1.0e-6
        relative_fitness: 1.0e-6
        rmse_threshold_m: 0.010
        fitness_threshold: 0.45
      SN0:
        voxel_size_m: 0.0
        max_correspondence_distance_m: 0.012
        max_iterations: 15
        relative_rmse: 1.0e-6
        relative_fitness: 1.0e-6
        rmse_threshold_m: 0.008
        # Allow modestly lower final overlap for different/sparser trees while
        # retaining the 8 mm RMSE ceiling and ICP-correction sanity bounds.
        fitness_threshold: 0.45

# Parameters for the field-validated JSON replay executable:
#   ros2 run arm_scan_motion scanning_trajectory --ros-args \
#     --params-file <absolute-path>/params.yaml \
#     -p trajectory_input_path:=<absolute-path>/recorded_scan_trajectory.json \
#     -p max_steps:=32      
scanning_trajectory:
  ros__parameters:
    capture_enabled: true
    capture_request_topic: /tree_scan/capture_request
    capture_result_topic: /tree_scan/capture_result
    scan_finished_topic: /tree_scan/scan_finished
    capture_settle_time_ms: 250
    # Includes all reconstruction-side retry attempts at the stationary pose.
    capture_timeout_sec: 60.0
    capture_subscriber_timeout_sec: 30.0
    # The reconstructor publishes -request_id only after capture_max_attempts
    # are exhausted, so this abort now represents repeated failures.
    abort_on_capture_rejection: false
    # Allows the unscaled controller to finish when the pendant/safety system
    # slows execution substantially (for example, a 20% speed slider).
    trajectory_timeout_scale: 10.0
    trajectory_timeout_margin_sec: 10.0
    max_steps: 0
    pause_ms: 300

# The same handshake for the separate MoveIt waypoint/recording executable.
# This generator was not the final field replay path.
scanning_trajectory_node:
  ros__parameters:
    capture_enabled: true
    capture_request_topic: /tree_scan/capture_request
    capture_result_topic: /tree_scan/capture_result
    scan_finished_topic: /tree_scan/scan_finished
    capture_settle_time_ms: 1000
    # Includes all reconstruction-side retry attempts at the stationary pose.
    capture_timeout_sec: 60.0
    capture_subscriber_timeout_sec: 30.0
    # The reconstructor publishes -request_id only after capture_max_attempts
    # are exhausted, so this abort now represents repeated failures.
    abort_on_capture_rejection: false
